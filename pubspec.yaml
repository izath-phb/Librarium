name: Librarium
description: A modern multi-vendor marketplace mobile app for Librarium.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  go_router: ^14.2.0
  dio: ^5.4.0
  cupertino_icons: ^1.0.6
  json_annotation: ^4.9.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  geolocator: ^11.0.1
  shared_preferences: ^2.2.3
  flutter_screenutil: ^5.9.3
  google_sign_in: ^7.2.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  image_picker: ^1.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/librarium_logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
